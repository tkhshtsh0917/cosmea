[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmea"
version = "0.1.0.dev0"
description = "Sampling-aware retrieval training for Sentence Transformers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["sentence-transformers>=6.3,<6.4", "torch>=2.15,<2.16", "numpy>=2,<3"]

[project.optional-dependencies]
train = ["sentence-transformers[train]>=6.3,<6.4"]
dev = ["pytest>=9,<10", "build>=1,<2", "setuptools>=68", "ruff>=0.14", "mypy==2.4.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cosmea*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: exact enumeration or Monte Carlo verification", "workers: multiprocessing DataLoader tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/cosmea"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
follow_imports = "silent"
