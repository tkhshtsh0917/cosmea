[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmea"
version = "0.1.0"
description = "Sampling-aware retrieval training for Sentence Transformers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.11"
dependencies = ["sentence-transformers>=6.3,<6.4", "torch>=2.6,<3", "numpy>=2,<3"]

[project.optional-dependencies]
train = ["sentence-transformers[train]>=6.3,<6.4"]

[dependency-groups]
dev = ["pytest>=9,<10", "build>=1,<2", "setuptools>=77.0.3", "ruff>=0.14", "mypy==2.4.1"]
docs = ["mkdocs>=1.6,<2", "mkdocstrings[python]>=1,<2", "pygments>=2.19,<3", "pymdown-extensions>=10,<11"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cosmea*"]

[tool.setuptools.package-data]
cosmea = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["workers: multiprocessing DataLoader tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/cosmea"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
follow_imports = "silent"
